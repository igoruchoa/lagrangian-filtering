[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6", "setuptools_scm_git_archive"]
build-backend = "setuptools.build_meta"

[project]
name = "lagrangian-filtering"
description = "Temporal filtering of data in a Lagrangian frame of reference"
authors = [{name = "Angus Gibson"}]
dynamic = ["version"]
requires-python = ">=3.8"
dependencies = [
    "dask[array]",
    "h5py",
    "numpy>=1.17.0",
    "scipy>=1.2.0",
    "xarray",
    "netCDF4",
    "parcels @ git+https://github.com/angus-g/parcels.git@openmp-loop#egg=parcels",
    "pykdtree",
    "sosfilt",
]

[project.optional-dependencies]
build = ["pytest", "findiff"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools_scm]
# reads version from git tags; write_to works across setuptools_scm v6, v7 and v8+
write_to = "filtering/_version.py"
